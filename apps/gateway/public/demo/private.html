<html lang="en">
  <head>

    <title>Sensitive fields fixture</title>
    <link rel="stylesheet" href="/demo/demo.css" />

  <body>
    <header>
      <a href="/demo/"><b>HypeMan</b><span> / browser fixture</span></a><span class="badge">DEMO · Fictional listings</span>

      <h1>Private details stay with you.</h1>
      <label
        >Password<input
          type="password"
          value="fixture-secret"
          autocomplete="current-password" /></label

        >Verification code<input name="otp" value="123456" autocomplete="one-time-code" /></label
      ><label
        >Card number<input name="card" value="4242424242424242" autocomplete="cc-number" /></label
      ><label>Ordinary note<input name="note" /></label><button>Delete account</button>
      <footer>
        All people, prices, and registrations are fictional fixtures.
        <a href="/demo/learning/">Learning</a> · <a href="/demo/video/">Video</a> ·
      </footer>
